.0539" x="5" y="393.7427">You should send this diagram and this image to</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="127.2068" x="277.1739" y="393.7427">plantuml@gmail.com</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="12.2161" x="407.5008" y="393.7427">or</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="39.4323" x="5" y="410.0868">post to</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="146.698" x="47.5523" y="410.0868">https://plantuml.com/qa</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="102.5048" x="197.3703" y="410.0868">to solve this issue.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="362.9666" x="5" y="426.4309">You can try to turn around this issue by simplifing your diagram.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="3.12" x="5" y="442.7751">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="171.7332" x="5" y="459.1192">java.lang.IllegalStateException</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="455.5711" x="11.2401" y="475.4633">net.sourceforge.plantuml.svek.DotStringFactory.solve(DotStringFactory.java:343)</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="553.5881" x="11.2401" y="491.8074">net.sourceforge.plantuml.svek.GraphvizImageBuilder.buildImage(GraphvizImageBuilder.java:285)</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="649.2048" x="11.2401" y="508.1515">net.sourceforge.plantuml.svek.CucaDiagramFileMakerSvek.cr