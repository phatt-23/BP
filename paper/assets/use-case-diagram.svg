<?plantuml 1.2026.1?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="984px" preserveAspectRatio="none" style="width:718px;height:984px;background:#FFFFFF;" version="1.1" viewBox="0 0 718 984" width="718px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="299.7261" x="5" y="17.8281">An error has occured : java.lang.IllegalStateException</text><text fill="#000000" font-family="sans-serif" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="303.254" x="5" y="34.1722">...except for the problem of too many levels of indirection</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="3.12" x="5" y="50.5163">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="186.8293" x="5" y="66.8604">PlantUML (1.2026.1) has crashed.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="3.12" x="5" y="83.2045">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="219.3495" x="5" y="99.5487">Diagram size: 30 lines / 737 characters.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="3.12" x="5" y="115.8928">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="336.5065" x="5" y="132.2369">PlantUML (1.2026.1) cannot parse result from dot/GraphViz.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="3.12" x="5" y="148.581">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="448.2272" x="5" y="164.9251">Please go to https://plantuml.com/graphviz-dot to check your GraphViz version.</text><text fill="#000000" font-famil